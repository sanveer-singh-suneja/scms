name: scms
description: "Smart Sports Equipment Management System — mobile app for students and staff."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP client
  dio: ^5.8.0+1

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Typography
  google_fonts: ^6.2.1

  # QR — display (student) and scan (staff)
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

  # Model generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Internationalisation / date formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.7
  json_serializable: ^6.9.2

flutter:
  uses-material-design: true
